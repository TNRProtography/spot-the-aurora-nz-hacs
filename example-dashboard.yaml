# Dashboard → Edit → Add Card → Manual → paste this whole thing.
# Requires the custom:aurora-oval-card resource to be registered first.

type: vertical-stack
cards:
  # ── Map with oval + view line ───────────────────────────────────────────────
  - type: custom:aurora-oval-card
    title: Aurora Oval
    height: 420px
    zoom: 4
    dark: true
    score_entity: sensor.substorm_score
    newell_30m_entity: sensor.solar_wind_newell_30m_average
    newell_60m_entity: sensor.solar_wind_newell_60m_average
    pressure_entity: sensor.solar_wind_pressure_30m_average
    bz_entity: sensor.solar_wind_bz
    visibility_entity: sensor.aurora_visibility_now

  # ── Visibility forecast ─────────────────────────────────────────────────────
  - type: entities
    title: Aurora Visibility
    show_header_toggle: false
    entities:
      - entity: sensor.aurora_visibility_now
        name: Now
        secondary_info: last-changed
      - entity: sensor.aurora_visibility_15_minutes
        name: 15 minutes
      - entity: sensor.aurora_visibility_30_minutes
        name: 30 minutes
      - entity: sensor.aurora_visibility_2_hours
        name: 2 hours
      - type: divider
      - entity: sensor.substorm_level
        name: Substorm level
      - entity: sensor.substorm_trend
        name: Trend
      - entity: sensor.substorm_confidence
        name: Confidence
      - entity: sensor.substorm_score
        name: Substorm score
      - entity: sensor.aurora_spot_score
        name: Spot The Aurora score

  # ── Current conditions at a glance ──────────────────────────────────────────
  - type: glance
    title: Solar Wind
    columns: 3
    entities:
      - entity: sensor.solar_wind_bz
        name: Bz
      - entity: sensor.solar_wind_bt
        name: Bt
      - entity: sensor.solar_wind_speed
        name: Speed
      - entity: sensor.solar_wind_density
        name: Density
      - entity: sensor.solar_wind_pressure
        name: Pressure
      - entity: sensor.aurora_hemispheric_power
        name: Hemi Power

  - type: glance
    title: Coupling
    columns: 3
    entities:
      - entity: sensor.solar_wind_newell_coupling
        name: Newell
      - entity: sensor.solar_wind_southward_minutes_30m
        name: Southward 30m
      - entity: sensor.l1_propagation_delay
        name: L1 Delay

  # ── X-ray flux & proton flux (SOLAR-1 / ACE / IMAP) ─────────────────────────
  - type: glance
    title: X-ray & proton flux
    columns: 3
    entities:
      - entity: sensor.x_ray_flux_long_band
        name: X-ray (long)
      - entity: sensor.proton_flux_solar_1
        name: Protons SOLAR-1
      - entity: sensor.proton_flux_ace
        name: Protons ACE
      - entity: sensor.proton_flux_imap
        name: Protons IMAP
      - entity: sensor.cme_count
        name: CMEs
      - entity: sensor.solar_flare_count
        name: Flares

  # ── Map with every aurora reporting on it ───────────────────────────────────
  # Reportings are geo_location entities from this integration; the map card
  # picks them up automatically via geo_location_sources. The list resets
  # daily at midday NZ time, same as the live site.
  - type: map
    title: Reportings map
    geo_location_sources:
      - spot_the_aurora_nz
    default_zoom: 5

  # ── Reportings, CMEs and flares as plain-text lists ─────────────────────────
  # CMEs and flares link each entry through to its own NASA DONKI detail
  # page - the same page the app itself opens when you click one in its
  # list. Reportings don't have individual pages, so that card links to the
  # live map instead.
  - type: markdown
    title: Aurora reportings today
    content: >
      {% set sightings = state_attr('sensor.aurora_sightings_today', 'sightings') or [] %}
      {% if sightings %}
      {% for s in sightings[:15] %}
      **{{ s.emoji }} {{ s.name }}** — {{ s.status_label }}{% if s.distance_km is not none %} · {{ s.distance_km }} km away{% endif %}

      {% endfor %}
      {% else %}
      No reportings since midday.

      {% endif %}
      [View the live map & report a sighting →](https://www.spottheaurora.co.nz/spot-the-aurora-forecast-advanced-view)

  - type: markdown
    title: Recent CMEs
    content: >
      {% set cmes = state_attr('sensor.cme_count', 'cmes') or [] %}
      {% for c in cmes[:10] %}
      {% set label = (as_timestamp(c.start_time) | timestamp_custom('%-d %b, %-I:%M %p')) if c.start_time else 'Unknown time' %}
      **{% if c.link %}[{{ label }}]({{ c.link }}){% else %}{{ label }}{% endif %}** — {{ c.speed_km_s | round(0) }} km/s{% if c.is_earth_directed %} · 🌍 Earth-directed{% endif %}

      {% endfor %}
      [Open the full 3D visualization →](https://www.spottheaurora.co.nz/cme-visualization)

  - type: markdown
    title: Recent solar flares
    content: >
      {% set flares = state_attr('sensor.solar_flare_count', 'flares') or [] %}
      {% for f in flares[:10] %}
      {% set label = f.class_type or '?' %}
      **{% if f.link %}[{{ label }}]({{ f.link }}){% else %}{{ label }}{% endif %}** — {{ f.source_location or 'unknown region' }}

      {% endfor %}
      [Open the full 3D visualization →](https://www.spottheaurora.co.nz/cme-visualization)

  # ── Full 3D CME & coronal hole visualization (the live web app) ─────────────
  # This dashboard only has the data - the real interactive 3D model lives on
  # the site, and it isn't built to be embedded, so link to it rather than
  # trying to frame it.
  - type: markdown
    content: >
      ### 🌌 Full 3D CME & coronal hole visualization

      **[CME Visualization](https://www.spottheaurora.co.nz/cme-visualization)**
      · **[Solar Activity Dashboard](https://www.spottheaurora.co.nz/solar-dashboard)**

  # ── Solar imagery, incl. raw coronal hole image ─────────────────────────────
  - type: grid
    title: Solar imagery
    columns: 2
    square: false
    cards:
      - type: picture
        image: https://sdo.gsfc.nasa.gov/assets/img/latest/latest_1024_0193.jpg
      - type: picture
        image: https://soho.nascom.nasa.gov/data/realtime/c3diff/1024/latest.jpg
      - type: picture
        image: https://services.swpc.noaa.gov/images/animations/suvi/primary/195/latest.png

  # ── IMF: Bt and Bz together ─────────────────────────────────────────────────
  - type: history-graph
    title: IMF — Bt & Bz (nT)
    hours_to_show: 12
    refresh_interval: 60
    entities:
      - entity: sensor.solar_wind_bt
        name: Bt
      - entity: sensor.solar_wind_bz
        name: Bz
      - entity: sensor.solar_wind_bz_30m_average
        name: Bz 30m avg

  # ── Plasma: speed and density ───────────────────────────────────────────────
  - type: history-graph
    title: Solar Wind — Speed & Density
    hours_to_show: 12
    refresh_interval: 60
    entities:
      - entity: sensor.solar_wind_speed
        name: Speed
      - entity: sensor.solar_wind_density
        name: Density

  # ── Scores over time ────────────────────────────────────────────────────────
  - type: history-graph
    title: Activity Scores
    hours_to_show: 24
    refresh_interval: 60
    entities:
      - entity: sensor.substorm_score
        name: Substorm
      - entity: sensor.aurora_spot_score
        name: Spot The Aurora

  - type: markdown
    content: >
      Data: NOAA SWPC / RTSW via Spot The Aurora. Forecast algorithm by
      [TNR Protography](https://www.tnrprotography.co.nz).
